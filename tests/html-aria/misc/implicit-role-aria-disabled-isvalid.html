<!DOCTYPE html>
<html lang="en">
<title>aria-disabled on elements whose implicit roles support it</title>
<button aria-disabled="true">Button</button>
<a role="link" aria-disabled="true">Placeholder link</a>
<fieldset aria-disabled="true"><legend>Group</legend></fieldset>
<input type="checkbox" aria-label="Checkbox" aria-disabled="true">
<textarea aria-label="Text" aria-disabled="true"></textarea>
<hr aria-disabled="true">
<details><summary aria-disabled="true">Summary</summary>Details</details>
