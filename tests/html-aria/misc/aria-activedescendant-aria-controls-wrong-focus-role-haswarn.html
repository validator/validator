<!DOCTYPE html>
<html lang="en">
<title>aria-activedescendant referring into an aria-controls element, on an element whose role isn't combobox, searchbox, or textbox</title>
<div role="group" tabindex="0" aria-label="Group" aria-activedescendant="opt1" aria-controls="lb"></div>
<div id="lb" role="listbox" aria-label="Options"><div role="option" id="opt1" aria-selected="true">One</div></div>
