<!DOCTYPE html>
<html lang="en">
<title>aria-activedescendant outside the element aria-controls refers to</title>
<input type="text" id="cb" role="combobox" aria-label="Pick"
  aria-expanded="true" aria-controls="lb" aria-activedescendant="opt3">
<div id="lb" role="listbox" aria-label="Options">
  <div role="option" id="opt1" aria-selected="false">One</div>
</div>
<div id="other" role="listbox" aria-label="Other options">
  <div role="option" id="opt3" aria-selected="false">Three</div>
</div>
