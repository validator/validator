<!DOCTYPE html>
<html lang="en">
<title>aria-activedescendant referring into an aria-controls element whose role doesn't support aria-activedescendant</title>
<input role="combobox" aria-label="Combobox" aria-expanded="true" aria-activedescendant="item1" aria-controls="list">
<ul id="list"><li id="item1">One</li></ul>
