<!DOCTYPE html>
<html lang="en">
<title>aria-activedescendant nested in the element aria-controls refers to</title>
<input type="text" id="cb" role="combobox" aria-label="Pick"
  aria-expanded="true" aria-controls="lb" aria-activedescendant="opt3">
<div id="lb" role="listbox" aria-label="Options">
  <div role="group" id="grp" aria-label="Group">
    <div role="option" id="opt1" aria-selected="false">One</div>
    <div role="option" id="opt3" aria-selected="false"><span id="inner">Three</span></div>
  </div>
</div>
