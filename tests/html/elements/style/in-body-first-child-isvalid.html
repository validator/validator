<!doctype html>
<meta charset=utf-8>
<title>style as the first child of an element in body</title>
<body>
<div>
  <!-- a comment -->
  <style>
    @scope {
      .card { border: 1px solid }
      .card > h1, .card p:first-child { margin: 0 }
      #intro:hover { color: blue }
    }
  </style>
  <div class=card><h1>Title</h1><p id=intro>Text</p></div>
</div>
