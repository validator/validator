<!doctype html><html lang=en><meta charset=utf-8>
<title>switch attribute on input type=checkbox</title>
<form>
<label><input type=checkbox switch> Mute notifications</label>
<label><input type=checkbox switch="" checked> Dark mode</label>
<label><input type="checkbox" switch="switch" required> Accept terms</label>
<label><input type="CheckBox" SWITCH name=a> Uppercase</label>
<label><input type=checkbox switch role=switch> Explicit role</label>
</form>
