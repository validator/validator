name: Bikeshed check

# Runs "python checker.py bikeshed-test", which generates
# tests/bikeshed/bikeshed-features.bs with the current Bikeshed (through the
# W3C spec generator), then checks the result the way w3c/spec-prod does, with
# --also-check-css. That catches markup or CSS that a new Bikeshed release
# starts emitting and the checker doesn't support yet, before spec editors run
# into it. And the scheduled runs, twice a day, catch a Bikeshed change even
# when nothing gets pushed here.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3,15 * * *'

permissions:
  contents: read

jobs:
  bikeshed-check:
    name: Check a Bikeshed-generated spec
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Java JDK
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 25
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      # Uses the same caches as the prep job in build.yml; see the comment
      # there. The dependencies cache gets the full dl-all set, not just what
      # the build step below needs, so that it's complete for the build.yml
      # jobs, too. And the build step runs the same jing-shade target that
      # fills the Maven repository in prep.
      - name: Compute the cache keys
        id: keys
        run: |
          echo "deps=dependencies-${{ hashFiles('build/build.xml') }}" >> "$GITHUB_OUTPUT"
          mvn_version=$(mvn -B --version | sed -n 's/^Apache Maven \([^ ]*\).*/\1/p')
          if [ -z "$mvn_version" ]; then
            echo "::error::Couldn't get the Maven version"
            exit 1
          fi
          echo "m2=m2-maven-$mvn_version-${{ hashFiles('build/shade-with-maven.py') }}" >> "$GITHUB_OUTPUT"
      - name: Cache the dependencies
        id: deps-cache
        uses: actions/cache@v6
        with:
          path: dependencies
          key: ${{ steps.keys.outputs.deps }}
          enableCrossOsArchive: true
      - name: Cache the Maven repository
        uses: actions/cache@v6
        with:
          path: ~/.m2/repository
          key: ${{ steps.keys.outputs.m2 }}
          enableCrossOsArchive: true
      - name: Download the dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          max_attempts=3
          attempt=1
          until ant -f build/build.xml dl-all; do
            if [ $attempt -ge $max_attempts ]; then
              echo "::error::Downloading the dependencies failed after $max_attempts attempts"
              exit 1
            fi
            echo "Attempt $attempt failed, retrying in 60 seconds..."
            sleep 60
            attempt=$((attempt + 1))
          done
      - name: Build vnu.jar
        run: python checker.py build
      - name: Generate the spec with the current Bikeshed, and check it
        run: python checker.py bikeshed-test
      - name: Upload the generated spec
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: bikeshed-features-html
          path: build/bikeshed/bikeshed-features.html
          if-no-files-found: ignore
